name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # v5 auto-caches when package.json has a packageManager field. Ours is
          # Vite+'s object form, and bun install already runs below — keep v4's
          # behaviour (no setup-node caching) rather than guess at the detector.
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, lint, type-check
        run: bunx vp check

      - name: Unit tests
        run: bunx vp run -r test

      - name: Build all packages
        run: bunx vp run -r build

  e2e:
    name: E2E and built-app smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # v5 auto-caches when package.json has a packageManager field. Ours is
          # Vite+'s object form, and bun install already runs below — keep v4's
          # behaviour (no setup-node caching) rather than guess at the detector.
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/demo

      - name: E2E against dev server
        run: bun run e2e
        working-directory: apps/demo

      - name: E2E the React embed example
        run: bun run e2e
        working-directory: apps/react-example

      - name: E2E the web components example
        run: bun run e2e
        working-directory: apps/elements-example

      - name: E2E the Vue embed example
        run: bun run e2e
        working-directory: apps/vue-example

      - name: E2E the Svelte embed example
        run: bun run e2e
        working-directory: apps/svelte-example

      - name: E2E the vanilla core example
        run: bun run e2e
        working-directory: apps/vanilla-example

      - name: Build all packages
        run: bunx vp run -r build

      - name: Smoke test the built app
        run: bunx playwright test -c e2e/playwright.config.ts --grep "loads the sample|renders every layer"
        working-directory: apps/demo
        env:
          E2E_PREVIEW: "1"

      # Production bundles behave differently from dev (tree-shaking almost
      # shipped blank embeds once) — re-run both embed suites against the
      # built apps.
      - name: Smoke test the built React embed example
        run: bun run e2e
        working-directory: apps/react-example
        env:
          E2E_PREVIEW: "1"

      - name: Smoke test the built web components example
        run: bun run e2e
        working-directory: apps/elements-example
        env:
          E2E_PREVIEW: "1"

      - name: Smoke test the built Vue embed example
        run: bun run e2e
        working-directory: apps/vue-example
        env:
          E2E_PREVIEW: "1"

      - name: Smoke test the built Svelte embed example
        run: bun run e2e
        working-directory: apps/svelte-example
        env:
          E2E_PREVIEW: "1"

      # Needs apps/widget/dist (built above) — the showcase iframes it.
      - name: E2E the widget showcase
        run: bun run e2e
        working-directory: apps/widget-example

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/demo/test-results/
          retention-days: 7
